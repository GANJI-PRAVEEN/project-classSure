spring.application.name=backend

# MongoDB Atlas / Production & Local Development Configuration
# Supports both SPRING_DATA_MONGODB_URI (standard Spring Boot 2/3 & Render env var)
# and SPRING_MONGODB_URI (Spring Boot 4 standard property)
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:mongodb://localhost:27017/db}}
spring.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:${SPRING_MONGODB_DATABASE:db}}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# Uses JWT_SECRET env var if set, otherwise jwt.secret with safe fallback for dev/testing
jwt.secret=${JWT_SECRET:}
